<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NDS LUCKY 100 · 관리자</title><link rel="stylesheet" href="../styles/nds-lucky-100.css"><link rel="stylesheet" href="../styles/nds-lucky-100-admin.css"><script type="module" src="../scripts/nds-lucky-100-admin.js"></script></head>
<body><main class="admin-shell">
<header class="admin-header"><div class="brand"><span class="brand-icon">✦</span><span>NDS <strong>LUCKY 100</strong> · 관리자</span></div><button id="logout" class="secondary" hidden>로그아웃</button></header>
<p id="message" class="message" role="status" aria-live="polite"></p>
<section id="loginPanel" class="card login"><p class="eyebrow">EVENT CONTROL</p><h1>관리자 로그인</h1><p class="help">운영 계정으로 로그인해 행사를 진행해 주세요.</p><form id="loginForm"><label for="adminId">관리자 ID</label><input id="adminId" autocomplete="username" required><label for="password">비밀번호</label><input id="password" type="password" autocomplete="current-password" required><button class="primary" type="submit">로그인</button></form></section>
<div id="dashboard" hidden>
<section class="card setup"><form id="createForm"><label for="titleInput">새 행사 이름</label><div class="inline"><input id="titleInput" maxlength="120" placeholder="NDS LUCKY 100" required><button class="secondary" type="submit">행사 생성</button></div></form><form id="loadForm"><label for="eventInput">기존 행사 ID</label><div class="inline"><input id="eventInput" placeholder="행사 UUID" required><button class="secondary" type="submit">불러오기</button></div></form></section>
<div id="eventPanel" hidden>
<section class="card"><div class="section-top"><div><p class="eyebrow">LIVE EVENT</p><h1 id="eventTitle"></h1></div><span id="status" class="badge"></span></div><div class="metrics"><span><strong id="participantCount">0</strong> / 100명 참가</span><span id="closedInfo"></span></div><label for="entryLink">참가자 공유 링크</label><div class="inline"><input id="entryLink" readonly><button id="copyLink" class="secondary">복사</button></div><p class="help">참가 링크를 QR 코드로 공유해 주세요. 접수 마감 후 수정·삭제는 불가능합니다.</p><div class="actions"><button id="refresh" class="secondary">새로고침</button><button id="close" class="danger">접수 마감</button><label for="winnerCount">당첨 인원</label><select id="winnerCount"><option value="2">2명</option><option value="3">3명</option></select><button id="draw" class="primary">추첨 시작</button><button id="finish" class="secondary">행사 종료</button><button id="csv" class="secondary">결과 CSV</button><button id="presentation" class="secondary">발표 모드</button></div></section>
<section id="stage" class="card stage"><div class="section-top"><h2>행운의 번호판</h2><button id="exitPresentation" class="secondary" hidden>발표 모드 닫기</button></div><p class="help stage-help">접수 중에는 등록된 번호를 눌러 이름을 수정하거나 삭제할 수 있습니다.</p><div id="board" class="admin-board" role="group" aria-label="참가자 번호판"></div><div id="announcement" class="announcement" role="status" aria-live="polite"></div><ol id="winners" class="winners"></ol></section>
</div></div>
<dialog id="editDialog"><form id="editForm"><h2><span id="editSlot"></span>번 참가자</h2><label for="editName">이름</label><input id="editName" maxlength="30" required><p id="editMessage" class="message" role="status"></p><div class="actions"><button id="saveEdit" class="primary" type="submit">저장</button><button id="deleteParticipant" class="danger" type="button">등록 삭제</button><button id="cancelEdit" class="secondary" type="button">닫기</button></div></form></dialog>
<noscript>JavaScript를 활성화해 주세요.</noscript></main></body></html>
