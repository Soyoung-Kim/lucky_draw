<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NDS LUCKY 100 · 관리자</title><link rel="stylesheet" href="../styles/nds-lucky-100.css"><link rel="stylesheet" href="../styles/nds-lucky-100-admin.css?v=20261013-variable-slots"><script type="module" src="../scripts/nds-lucky-100-admin.js?v=20261013-event-list"></script></head>
<body><main class="admin-shell">
<header class="admin-header"><div class="brand"><span class="brand-icon">✦</span><span>NDS <strong>LUCKY 100</strong> · 관리자</span></div><button id="logout" class="secondary" hidden>로그아웃</button></header>
<p id="message" class="message" role="status" aria-live="polite"></p>
<section id="loginPanel" class="card login"><p class="eyebrow">EVENT CONTROL</p><h1>관리자 로그인</h1><p class="help">운영 계정으로 로그인해 행사를 진행해 주세요.</p><form id="loginForm"><label for="adminId">관리자 ID</label><input id="adminId" autocomplete="username" required><label for="password">비밀번호</label><input id="password" type="password" autocomplete="current-password" required><button class="primary" type="submit">로그인</button></form></section>
<div id="dashboard" hidden>
<section class="card setup"><form id="createForm"><label for="initialSlots">초기 칸 수 (2~150)</label><input id="initialSlots" type="number" min="2" max="150" step="1" value="100" required><label for="titleInput">새 행사 이름</label><div class="inline"><input id="titleInput" maxlength="120" placeholder="NDS LUCKY 100" required><button class="secondary" type="submit">행사 생성</button></div></form><form id="loadForm"><label for="eventInput">행사 선택 · 상태 · 생성일</label><div class="inline"><select id="eventInput" required><option value="">로그인 후 행사를 선택해 주세요</option></select><button id="refreshEvents" class="secondary" type="button">목록 갱신</button><button class="secondary" type="submit">불러오기</button></div></form></section>
<div id="eventPanel" hidden>
<section class="card"><div class="section-top"><div><p class="eyebrow">LIVE EVENT</p><h1 id="eventTitle"></h1></div><span id="status" class="badge"></span></div><div class="metrics"><span><strong id="participantCount">0</strong> / <span id="maxSlots">100</span>명 참가</span><span id="closedInfo"></span></div><label for="entryLink">참가자 공유 링크</label><div class="inline"><input id="entryLink" readonly><button id="copyLink" class="secondary">복사</button></div><p class="help">참가 링크를 QR 코드로 공유해 주세요. 접수 마감 후 수정·삭제는 불가능합니다.</p><div class="actions"><button id="refresh" class="secondary">새로고침</button><button id="close" class="danger">접수 마감</button><form id="addSlotsForm" class="inline slot-add"><label for="addSlotsInput">칸 추가</label><input id="addSlotsInput" type="number" min="1" max="148" step="1" value="2" required><button id="addSlotsButton" class="secondary" type="submit">추가</button></form><label for="winnerCount">당첨 인원</label><select id="winnerCount"><option value="1">1명</option><option value="2" selected>2명</option><option value="3">3명</option><option value="4">4명</option><option value="5">5명</option><option value="6">6명</option><option value="7">7명</option><option value="8">8명</option><option value="9">9명</option><option value="10">10명</option></select><button id="draw" class="primary">추첨 시작</button><button id="finish" class="secondary">행사 종료</button><button id="csv" class="secondary">결과 CSV</button><button id="presentation" class="secondary">발표 모드</button></div></section>
<section id="stage" class="card stage"><div class="section-top"><h2>행운의 번호판</h2><button id="exitPresentation" class="secondary" hidden>발표 모드 닫기</button></div><p class="help stage-help">접수 중: 등록된 번호의 X로 삭제 · 번호 클릭으로 이름 수정 · 빈 번호 더블클릭으로 등록</p><div class="actions reveal-controls"><button id="stageDraw" class="primary" type="button">추첨 시작</button><button id="nextWinner" class="primary" type="button">다음 당첨자 공개</button><span id="revealProgress"></span></div><p id="stageMessage" class="message" role="status"></p><div id="board" class="admin-board" role="group" aria-label="참가자 번호판"></div><form id="seedForm" class="test-tools"><label for="testCount">테스트 참가자 넣기</label><div class="inline"><input id="testCount" type="number" min="1" max="100" step="1" value="40" required aria-describedby="testHelp"><button id="seedButton" class="secondary" type="submit">넣기</button></div><p id="testHelp" class="help">1~100명 · 빈 번호에 중복 없는 세 글자 이름을 무작위로 등록합니다. 실제 추첨 대상에 포함됩니다.</p><button id="testReopen" class="secondary" type="button" hidden>접수 재개</button></form><div id="announcement" class="announcement" role="status" aria-live="polite"></div><ol id="winners" class="winners"></ol><div id="winnerPopup" class="winner-popup" hidden role="dialog" aria-modal="true" aria-labelledby="popupTitle"><div class="winner-popup-card"><p id="popupTitle">행운의 주인공은?</p><div id="popupNumber" class="popup-number"></div><h2 id="popupName"></h2><p id="popupProgress"></p><div class="actions"><button id="popupNext" class="primary" type="button">다음 당첨자 공개</button><button id="popupClose" class="secondary" type="button">번호판 보기</button></div></div></div></section>
</div></div>
<dialog id="editDialog"><form id="editForm"><h2><span id="editSlot"></span>번 참가자</h2><label for="editName">이름</label><input id="editName" maxlength="30" required><p id="editMessage" class="message" role="status"></p><div class="actions"><button id="saveEdit" class="primary" type="submit">저장</button><button id="deleteParticipant" class="danger" type="button">등록 삭제</button><button id="cancelEdit" class="secondary" type="button">닫기</button></div></form></dialog>
<noscript>JavaScript를 활성화해 주세요.</noscript></main></body></html>
