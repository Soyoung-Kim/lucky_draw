<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>은지의 예약함 · reserves-ej-admin</title><link rel="stylesheet" href="../styles/reserves-ej.css"><script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script type="module" src="../scripts/reserves-ej-admin.js"></script></head><body><div class="shell"><header class="topbar"><a class="brand" href="../reserves-ej/"><span class="brand-mark">ej.</span> reserves-ej <small>ADMIN</small></a><div><a href="../reserves-ej/">공개 달력 ↗</a> <button id="logout" hidden>로그아웃</button></div></header><main><section class="admin-hero"><p class="eyebrow">ONLY FOR EUNJI</p><h1>은지의 예약함<span class="dot">.</span></h1><p class="intro">누구와, 언제 만날지. 마음 가는 약속을 골라요.</p></section><p id="message" class="message" role="status" aria-live="polite"></p><section id="loginPanel" class="panel login-panel"><h2>은지, 어서 와요.</h2><p class="muted">운영 관리자 계정으로 로그인해 주세요.</p><form id="loginForm"><label>관리자 ID<input name="admin_id" autocomplete="username" required></label><label>비밀번호<input name="password" type="password" autocomplete="current-password" required></label><button class="primary full">예약함 열기 →</button></form></section><div id="dashboard" hidden><div class="admin-toolbar"><div class="tabs" aria-label="요청 필터"><button data-filter="pending" class="active">대기 중</button><button data-filter="approved">확정</button><button data-filter="all">전체</button></div><button id="refresh">새로고침 ↻</button></div><div class="admin-layout"><section><h2 id="listTitle">기다리는 약속</h2><div id="requests"></div></section><aside class="panel day-settings"><p class="eyebrow">MY DAY, MY RULES</p><h2>날짜 관리</h2><p class="muted">쉬고 싶은 날은 예약을 닫아 두세요.</p><form id="dayForm"><label>날짜<input name="day" type="date" min="2026-10-26" max="2027-05-31" required></label><label>예약 상태<select name="is_open"><option value="true">예약 가능</option><option value="false">예약 닫기</option></select></label><label>공휴일 이름<input name="holiday" maxlength="40" placeholder="공휴일이 아니면 비워 두세요"></label><label>공개 메모<input name="note" maxlength="100" placeholder="예: 오늘은 충전하는 날"></label><p class="muted small">예약을 닫아도 기존 확정 일정은 유지돼요. 취소는 확정 목록에서 해주세요.</p><button class="primary full">날짜 설정 저장</button></form></aside></div></div></main><footer>은지의 시간은 소중하니까. <span>made for ej ♡</span></footer></div><noscript>JavaScript를 활성화해 주세요.</noscript></body></html>
